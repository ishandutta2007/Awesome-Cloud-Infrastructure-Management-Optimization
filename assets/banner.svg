<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" style="background:#090d16; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="pillGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.1" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <style>
    .glow-orb {
      transform-origin: center;
      animation: pulseGlow 6s ease-in-out infinite alternate;
    }
    .wave-line {
      stroke-dasharray: 8 8;
      animation: dashMove 25s linear infinite;
    }
    .float-card {
      animation: floatMotion 5s ease-in-out infinite alternate;
    }
    .radar-pulse {
      animation: ripple 4s cubic-bezier(0, 0.2, 0.8, 1) infinite;
    }
    @keyframes pulseGlow {
      0% { transform: scale(0.9) translate(0, 0); opacity: 0.35; }
      100% { transform: scale(1.15) translate(15px, -15px); opacity: 0.65; }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -1000; }
    }
    @keyframes floatMotion {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
    @keyframes ripple {
      0% { r: 10px; opacity: 0.8; stroke-width: 2; }
      100% { r: 85px; opacity: 0; stroke-width: 0.5; }
    }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Dynamic Background Ambient Glowing Orbs -->
  <circle cx="150" cy="100" r="140" fill="#2563eb" filter="url(#glow)" class="glow-orb" />
  <circle cx="1060" cy="300" r="160" fill="#059669" filter="url(#glow)" class="glow-orb" style="animation-duration: 8s;" />
  <circle cx="980" cy="90" r="120" fill="#0284c7" filter="url(#glow)" class="glow-orb" style="animation-duration: 7s;" />

  <!-- Dynamic Technical Grid Wave / FinOps Topology Curves -->
  <path d="M -50 340 Q 300 240 600 320 T 1250 260" fill="none" stroke="url(#lineGrad)" stroke-width="2.5" class="wave-line" />
  <path d="M -50 370 Q 250 300 650 370 T 1250 310" fill="none" stroke="url(#lineGrad)" stroke-width="1.5" opacity="0.6" class="wave-line" style="animation-direction: reverse; animation-duration: 35s;" />

  <!-- Animated Radar Beacon Node (Cloud Monitoring) in Right Background -->
  <g transform="translate(1020, 180)">
    <circle cx="0" cy="0" r="10" fill="#38bdf8" />
    <circle cx="0" cy="0" r="20" fill="none" stroke="#38bdf8" class="radar-pulse" />
    <circle cx="0" cy="0" r="45" fill="none" stroke="#34d399" class="radar-pulse" style="animation-delay: 1.5s;" />
  </g>

  <!-- Foreground Title and Branding Content (Crisp, High Contrast, Centered & Unobstructed) -->
  <g transform="translate(600, 115)" text-anchor="middle">
    <!-- Super Header Badge -->
    <rect x="-190" y="-38" width="380" height="32" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" opacity="0.9" />
    <text x="0" y="-17" fill="#60a5fa" font-size="12" font-weight="700" letter-spacing="2.5">☁️ MULTI-CLOUD &amp; KUBERNETES FINOPS</text>

    <!-- Main Title -->
    <text x="0" y="42" fill="url(#textGrad)" font-size="44" font-weight="800" letter-spacing="-0.5">
      Cloud Infrastructure Management
    </text>
    <text x="0" y="92" fill="#ffffff" font-size="34" font-weight="700" letter-spacing="-0.5">
      &amp; Resource Optimization
    </text>

    <!-- Subtitle -->
    <text x="0" y="136" fill="#94a3b8" font-size="16" font-weight="400">
      Curated ecosystem of enterprise FinOps platforms, autonomous rightsizers, and open-source cost analyzers
    </text>
  </g>

  <!-- Dynamic Feature Badges / Pills (Layered safely in the lower section) -->
  <g transform="translate(600, 310)" text-anchor="middle" class="float-card">
    <!-- FinOps Open Standard -->
    <g transform="translate(-360, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="url(#pillGrad1)" stroke="#3b82f6" stroke-width="1.2" />
      <text x="0" y="5" fill="#93c5fd" font-size="13.5" font-weight="600">📊 FinOps &amp; FOCUS</text>
    </g>

    <!-- Kubernetes Rightsizing -->
    <g transform="translate(-120, 0)">
      <rect x="-95" y="-18" width="190" height="36" rx="18" fill="url(#pillGrad2)" stroke="#10b981" stroke-width="1.2" />
      <text x="0" y="5" fill="#6ee7b7" font-size="13.5" font-weight="600">⚡ Automated Rightsizing</text>
    </g>

    <!-- Cloud Spend Visibility -->
    <g transform="translate(130, 0)">
      <rect x="-95" y="-18" width="190" height="36" rx="18" fill="url(#pillGrad1)" stroke="#38bdf8" stroke-width="1.2" />
      <text x="0" y="5" fill="#7dd3fc" font-size="13.5" font-weight="600">💰 Cost Visibility &amp; CUR</text>
    </g>

    <!-- Autonomous Scaling -->
    <g transform="translate(370, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="url(#pillGrad2)" stroke="#34d399" stroke-width="1.2" />
      <text x="0" y="5" fill="#a7f3d0" font-size="13.5" font-weight="600">🚀 Autonomous Scaling</text>
    </g>
  </g>

  <!-- Bottom Accent Border -->
  <rect x="0" y="415" width="1200" height="5" fill="url(#textGrad)" />
</svg>
